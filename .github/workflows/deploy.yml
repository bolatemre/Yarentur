# Repoya (main) her değişiklik gönderildiğinde siteyi Natro'ya otomatik yükler.
# Sadece değişen dosyalar gönderilir. data/ ve uploads/ asla ezilmez.
# Gerekli secret'lar: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD

name: Natro'ya yükle

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: FTP ile yükle
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            data/**
            uploads/**
            README.md
            .htaccess
